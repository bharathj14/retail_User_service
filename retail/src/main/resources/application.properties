spring.application.name=retail
server.port=8005

#spring.datasource.url=jdbc:mysql://localhost:3307/retail?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
#spring.datasource.username=root
#spring.datasource.password=

spring.datasource.url=jdbc:mysql://localhost:3306/retail
spring.datasource.username=root
spring.datasource.password=
logging.level.root=INFO
logging.level.com.retail=DEBUG

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

security.jwt.secret-key=53571f9f0c23028ccf802ee3d853f67fff9351e698c3f32c9300b1d78916bbf2
# 1h in millisecond
security.jwt.expiration-time=3600000

# Session store type.
spring.session.store-type=jdbc
# Database schema initialization mode.
spring.session.jdbc.initialize-schema=always
# Path to the SQL file to use to initialize the database schema.
spring.session.jdbc.schema=classpath:org/springframework/session/jdbc/schema-@@platform@@.sql
# Name of the database table used to store sessions.
spring.session.jdbc.table-name=SPRING_SESSION





